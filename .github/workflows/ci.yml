# CI do correios-entregas — verificação apenas (sem deploy).
#
# Este sistema existe SÓ em ambiente de desenvolvimento (decisão do dono,
# 2026-07-19): o dev roda no VPS com bind mounts + hot reload
# (docker-compose.yml), então não há job de deploy — o push em develop já "é"
# o deploy de dev. Espelho reduzido do modelo dokimo/prosio (ci.yml valida em
# runner do GitHub; runner self-hosted é reservado a deploy de produção, que
# aqui não existe).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify codebase
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: correios_user
          POSTGRES_PASSWORD: correios_ci
          # Banco dedicado aos testes: o globalSetup do Jest só aceita nomes
          # terminados em _test (apaga o schema e reaplica as migrations).
          POSTGRES_DB: correiosentregas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U correios_user -d correiosentregas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://correios_user:correios_ci@localhost:5432/correiosentregas_test?schema=public
      TEST_DATABASE_URL: postgresql://correios_user:correios_ci@localhost:5432/correiosentregas_test?schema=public
      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: mitigação de supply chain (postinstall de dependência
      # não executa código no runner), mesmo padrão ADR-0026 do dokimo.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prisma generate
        run: cd backend && npx prisma generate

      # Banco vazio: as migrations (0000_baseline + seguintes) criam o schema
      # inteiro do zero; o status precisa ficar limpo.
      - name: Prisma migrate deploy
        run: cd backend && npx prisma migrate deploy

      - name: Prisma migrate status
        run: cd backend && npx prisma migrate status

      - name: Lint
        run: npm run lint

      - name: Test (unit)
        run: npm run test:unit -w backend

      - name: Test (integration)
        run: npm run test:integration -w backend

      - name: Build
        run: npm run build

  # Jornadas E2E das telas da captura (Playwright, ADR-013): o frontend no
  # `vite preview` do build de teste (VITE_E2E=1, câmera trocada pelas fixtures
  # de rótulo via ?e2eImage=) e o backend com o extrator falso
  # (CAPTURA_AI_PROVIDER=fake), ViaCEP falso e o banco _test recriado.
  e2e-captura:
    name: E2E (captura)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: correios_user
          POSTGRES_PASSWORD: correios_ci
          POSTGRES_DB: correiosentregas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U correios_user -d correiosentregas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://correios_user:correios_ci@localhost:5432/correiosentregas_test?schema=e2e_captura
      TEST_REDIS_URL: redis://localhost:6379/2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prisma generate
        run: cd backend && npx prisma generate

      - name: Install Chromium
        run: cd frontend && npx playwright install --with-deps chromium

      # build:e2e + playwright test -c playwright.captura.config.ts
      - name: E2E da captura
        run: npm run test:e2e:captura -w frontend

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-captura
          path: |
            frontend/playwright-report-captura
            frontend/test-results-captura
          retention-days: 7
