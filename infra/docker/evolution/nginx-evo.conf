# Adicionar ao nginx como /etc/nginx/conf.d/evolution.conf
# Subdomínio: evo.correios-entregas.com → Evolution API :8080

server {
    listen 80;
    server_name evo.correios-entregas.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name evo.correios-entregas.com;

    ssl_certificate     /etc/letsencrypt/live/correios-entregas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/correios-entregas.com/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://localhost:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
