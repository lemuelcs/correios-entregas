services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: correios-postgres
    environment:
      POSTGRES_USER: usr_correiosentrega
      POSTGRES_PASSWORD: Correios123
      POSTGRES_DB: correiosentrega_dev
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usr_correiosentrega -d correiosentrega_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: correios-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
