# ==============================================================================
# Docker Compose - PRODUCAO - Correios-Entregas
# Reusa Postgres/Redis/OSRM/VROOM/Evolution do hub delivyo-services.
# Conecta na rede delivyo-services_delivyo_network (externa).
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: correios-backend:prod
    container_name: correiosentrega-backend
    restart: unless-stopped
    env_file:
      - backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 3002
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://${POSTGRES_ADMIN_USER:-postgres}:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/correiosentrega_db?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OSRM_URL: http://osrm:5000
      VROOM_URL: http://vroom:3000
      # WhatsApp via hub centralizado (delivyo-services/microservices/ms-whatsapp)
      WHATSAPP_HUB_BASE_URL: ${WHATSAPP_HUB_BASE_URL:-http://traefik/services/whatsapp}
      WHATSAPP_HUB_API_PREFIX: ${WHATSAPP_HUB_API_PREFIX:-/api/comunicacao}
      WHATSAPP_HUB_TIMEOUT_MS: ${WHATSAPP_HUB_TIMEOUT_MS:-10000}
      WHATSAPP_HUB_TENANT_ID: ${WHATSAPP_HUB_TENANT_ID:-CORREIOS}
      APP_URL: https://correios.delivyo.com
      FRONTEND_URL: https://correios.delivyo.com
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3002/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - delivyo_shared_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=delivyo-services_delivyo_network"
      - "traefik.http.services.correios-backend.loadbalancer.server.port=3002"
      - "traefik.http.routers.correios-api.rule=Host(`correios.delivyo.com`) && (PathPrefix(`/api`) || PathPrefix(`/health`))"
      - "traefik.http.routers.correios-api.entrypoints=websecure"
      - "traefik.http.routers.correios-api.priority=100"
      - "traefik.http.routers.correios-api.tls=true"
      - "traefik.http.routers.correios-api.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-api.tls.domains[0].main=delivyo.com"
      - "traefik.http.routers.correios-api.tls.domains[0].sans=*.delivyo.com"
      - "traefik.http.routers.correios-api.middlewares=sec-headers@file,compress@file,rate-limit-api@file"
      - "traefik.http.routers.correios-api.service=correios-backend"
      - "traefik.http.routers.correios-sse.rule=Host(`correios.delivyo.com`) && PathPrefix(`/events`)"
      - "traefik.http.routers.correios-sse.entrypoints=websecure"
      - "traefik.http.routers.correios-sse.priority=110"
      - "traefik.http.routers.correios-sse.tls=true"
      - "traefik.http.routers.correios-sse.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-sse.middlewares=sec-headers@file,sse-passthrough@file"
      - "traefik.http.routers.correios-sse.service=correios-backend"
      - "traefik.http.routers.correios-redirect.rule=Host(`correios.delivyo.com`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/events`))"
      - "traefik.http.routers.correios-redirect.entrypoints=web"
      - "traefik.http.routers.correios-redirect.middlewares=redirect-to-https@file"
      - "traefik.http.routers.correios-redirect.service=noop@internal"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: correios-frontend:prod
    container_name: correiosentrega-frontend
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - delivyo_shared_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=delivyo-services_delivyo_network"
      - "traefik.http.services.correios-web.loadbalancer.server.port=80"
      - "traefik.http.routers.correios-web.rule=Host(`correios.delivyo.com`)"
      - "traefik.http.routers.correios-web.entrypoints=websecure"
      - "traefik.http.routers.correios-web.priority=50"
      - "traefik.http.routers.correios-web.tls=true"
      - "traefik.http.routers.correios-web.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-web.tls.domains[0].main=delivyo.com"
      - "traefik.http.routers.correios-web.tls.domains[0].sans=*.delivyo.com"
      - "traefik.http.routers.correios-web.middlewares=sec-headers@file,compress@file"
      - "traefik.http.routers.correios-web.service=correios-web"
      - "traefik.http.routers.correios-web-redirect.rule=Host(`correios.delivyo.com`)"
      - "traefik.http.routers.correios-web-redirect.entrypoints=web"
      - "traefik.http.routers.correios-web-redirect.middlewares=redirect-to-https@file"
      - "traefik.http.routers.correios-web-redirect.service=noop@internal"

networks:
  delivyo_shared_network:
    external: true
    name: delivyo-services_delivyo_network
