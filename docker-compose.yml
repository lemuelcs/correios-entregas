services:
  redis:
    build:
      context: .
      dockerfile: redis/Dockerfile
    container_name: correiosentrega-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  osrm:
    build:
      context: .
      dockerfile: osrm/Dockerfile
    container_name: correiosentrega-osrm
    restart: unless-stopped
    volumes:
      - osrm-data:/data
    environment:
      OSM_REGION_URL: https://download.geofabrik.de/south-america/brazil/centro-oeste-latest.osm.pbf
      OSRM_DATASET: centro-oeste-latest
      OSRM_PROFILE: /opt/car.lua
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/nearest/v1/driving/-47.8825,-15.7942 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  vroom:
    build:
      context: .
      dockerfile: vroom/Dockerfile
    container_name: correiosentrega-vroom
    restart: unless-stopped
    environment:
      VROOM_ROUTER: osrm
    depends_on:
      osrm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  evolution-api:
    image: atendai/evolution-api:v2.2.3
    container_name: correiosentrega-evolution
    restart: unless-stopped
    environment:
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change_me_evolution_key}
      DATABASE_PROVIDER: postgresql
      DATABASE_ENABLED: "true"
      DATABASE_CONNECTION_URI: postgresql://temellodev:temellodev123@host.docker.internal:5432/correios_evolution_db
      DATABASE_CONNECTION_CLIENT_NAME: correios_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: correios_evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      LOG_LEVEL: warn
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: correiosentrega-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://usr_correiosentrega:Correios123@host.docker.internal:5432/correiosentrega_dev?schema=public
      REDIS_URL: redis://redis:6379
      OSRM_URL: http://osrm:5000
      VROOM_URL: http://vroom:3000
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_PILOT_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: change_me_evolution_key
      EVOLUTION_PILOT_API_KEY: change_me_evolution_key
      EVOLUTION_PILOT_WEBHOOK_SECRET: change_me_webhook_secret
      APP_URL: http://backend:3002
      PORT: 3002
      FRONTEND_URL: http://localhost:5180
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      osrm:
        condition: service_healthy
      vroom:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3002/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: correiosentrega-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5180:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  redis-data:
  osrm-data:
