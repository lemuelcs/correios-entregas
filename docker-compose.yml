services:
  # NOTE: Evolution/WhatsApp segue via gateway Traefik em
  # http://host.docker.internal/services/whatsapp (hub centralizado).
  #
  # Redis (2026-07-19): passou a ser dedicado a este projeto, não mais
  # compartilhado com dev_redis (dokimo/prosio). Motivo: dev_redis deriva a
  # senha de duas formas incompatíveis entre consumidores — um cliente
  # decodifica REDIS_URL como URL (correios, dokimo), outro usa a string
  # crua (prosio) — então só um dos dois conseguia autenticar por vez.
  # Isolar aqui evita depender de como os outros produtos tratam a senha.
  redis:
    image: redis:8-alpine
    container_name: correiosentrega-redis
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    cpu_shares: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    init: true
    command:
      [
        "redis-server",
        "--requirepass", "${CORREIOS_REDIS_PASSWORD}",
        "--appendonly", "yes",
        "--maxmemory", "96mb",
        "--maxmemory-policy", "noeviction",
      ]
    volumes:
      - correios_redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${CORREIOS_REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  osrm:
    build:
      context: .
      dockerfile: osrm/Dockerfile
    container_name: correiosentrega-osrm
    profiles: ["legacy"]
    restart: unless-stopped
    volumes:
      - osrm-data:/data
    environment:
      OSM_REGION_URL: https://download.geofabrik.de/south-america/brazil/centro-oeste-latest.osm.pbf
      OSRM_DATASET: centro-oeste-latest
      OSRM_PROFILE: /opt/car.lua
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/nearest/v1/driving/-47.8825,-15.7942 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  vroom:
    build:
      context: .
      dockerfile: vroom/Dockerfile
    container_name: correiosentrega-vroom
    profiles: ["legacy"]
    restart: unless-stopped
    environment:
      VROOM_ROUTER: osrm
    depends_on:
      osrm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    # Build de PRODUÇÃO desde 2026-07-28. Antes usava `backend/Dockerfile.dev`
    # (`tsx watch src/server.ts`) para servir correiosdev.com, um domínio
    # PÚBLICO — um servidor de desenvolvimento com watcher de arquivos rodando
    # em produção. O Dockerfile de produção compila com `tsc` e roda
    # `node dist/server.js` a partir de uma imagem com `npm ci --omit=dev`.
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: correiosentrega-backend
    restart: unless-stopped
    mem_limit: 256m
    # Guardrail dev/prod no mesmo host (2026-07-19): teto de CPU + cpu_shares
    # baixo — dev nunca degrada os stacks prod (cpu_shares 2048).
    cpus: "0.75"
    cpu_shares: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - backend/.env
    environment:
      # `backend/.env` (linha 20) traz NODE_ENV=development, e `env_file` tem
      # precedência sobre o `ENV NODE_ENV=production` do Dockerfile — então o
      # container subia em modo de desenvolvimento mesmo com a imagem de
      # produção. Consequência concreta: `shared/utils/prisma.ts` usa
      # `log: ['query','error','warn']` em development, ou seja, TODA query SQL
      # ia para o log — alocação e I/O contínuos, além de expor parâmetros de
      # consulta no journal. Declarar aqui vence o env_file e mantém o `.env`
      # intacto para quem usa o mesmo arquivo no desenvolvimento local.
      # Verificado: NODE_ENV só é lido em 3 pontos do backend (server.ts,
      # logger.ts, prisma.ts), todos de logging — nada de CORS, cookie ou auth
      # depende dele.
      NODE_ENV: production
      DATABASE_URL: ${CORREIOS_DATABASE_URL}
      REDIS_URL: ${CORREIOS_REDIS_URL}
      OSRM_URL: http://host.docker.internal:5001
      VROOM_URL: http://host.docker.internal:3000
      # WhatsApp via hub centralizado (delivyo-services/microservices/ms-whatsapp)
      WHATSAPP_HUB_BASE_URL: http://host.docker.internal/services/whatsapp
      WHATSAPP_HUB_API_PREFIX: /api/v1/comunicacao
      WHATSAPP_HUB_TIMEOUT_MS: 10000
      WHATSAPP_HUB_TENANT_ID: CORREIOS
      # JWT_SECRET compartilhado com ms-whatsapp para inter-service auth (proxy reemite token).
      WHATSAPP_HUB_JWT_SECRET: ${CORREIOS_WHATSAPP_HUB_JWT_SECRET}
      APP_URL: http://backend:3002
      PORT: 3002
      FRONTEND_URL: http://localhost:5181
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # SEM bind mount do código (removido em 2026-07-28 junto com a troca para o
    # Dockerfile de produção): `./backend:/app/backend` montava a árvore do host
    # por cima de `/app/backend` da imagem, o que apagaria o `dist/` compilado
    # no build e faria o container servir o que estivesse no disco do host.
    # Para desenvolvimento com hot reload, use o Dockerfile.dev, que continua
    # no repositório.
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - delivyo_network
      - dev-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=delivyo_network"
      # Router API (HTTP regular)
      - "traefik.http.routers.correios-api.rule=(Host(`dev.correiosdev.com`) || Host(`correios.delivyodev.com`) || Host(`correiosdev.com`) || Host(`www.correiosdev.com`)) && (PathPrefix(`/api`) || PathPrefix(`/health`))"
      - "traefik.http.routers.correios-api.entrypoints=websecure"
      - "traefik.http.routers.correios-api.tls=true"
      - "traefik.http.routers.correios-api.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-api.priority=100"
      - "traefik.http.routers.correios-api.middlewares=sec-headers@file,compress@file,rate-limit-api@file"
      - "traefik.http.routers.correios-api.service=correios-backend"
      # Router SSE (sem buffering, sem compress)
      - "traefik.http.routers.correios-sse.rule=(Host(`dev.correiosdev.com`) || Host(`correios.delivyodev.com`) || Host(`correiosdev.com`) || Host(`www.correiosdev.com`)) && PathPrefix(`/events`)"
      - "traefik.http.routers.correios-sse.entrypoints=websecure"
      - "traefik.http.routers.correios-sse.tls=true"
      - "traefik.http.routers.correios-sse.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-sse.priority=110"
      - "traefik.http.routers.correios-sse.middlewares=sec-headers@file,sse-passthrough@file"
      - "traefik.http.routers.correios-sse.service=correios-backend"
      # Router Auth (rate limit mais estrito contra brute force)
      - "traefik.http.routers.correios-auth.rule=(Host(`dev.correiosdev.com`) || Host(`correios.delivyodev.com`) || Host(`correiosdev.com`) || Host(`www.correiosdev.com`)) && (Path(`/api/v1/auth/login`) || Path(`/api/v1/auth/refresh`))"
      - "traefik.http.routers.correios-auth.entrypoints=websecure"
      - "traefik.http.routers.correios-auth.tls=true"
      - "traefik.http.routers.correios-auth.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-auth.priority=200"
      - "traefik.http.routers.correios-auth.middlewares=sec-headers@file,rate-limit-auth@file"
      - "traefik.http.routers.correios-auth.service=correios-backend"
      - "traefik.http.services.correios-backend.loadbalancer.server.port=3002"
      # ---- api.correiosdev.com — subdomain dedicado ao backend ----
      # Rota base: todo tráfego em api.correiosdev.com vai para o backend
      - "traefik.http.routers.correios-api-sub.rule=Host(`api.correiosdev.com`)"
      - "traefik.http.routers.correios-api-sub.entrypoints=websecure"
      - "traefik.http.routers.correios-api-sub.tls=true"
      - "traefik.http.routers.correios-api-sub.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-api-sub.priority=50"
      - "traefik.http.routers.correios-api-sub.middlewares=sec-headers@file,compress@file,rate-limit-api@file"
      - "traefik.http.routers.correios-api-sub.service=correios-backend"
      # SSE em api.correiosdev.com (sem buffering)
      - "traefik.http.routers.correios-sse-sub.rule=Host(`api.correiosdev.com`) && PathPrefix(`/events`)"
      - "traefik.http.routers.correios-sse-sub.entrypoints=websecure"
      - "traefik.http.routers.correios-sse-sub.tls=true"
      - "traefik.http.routers.correios-sse-sub.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-sse-sub.priority=110"
      - "traefik.http.routers.correios-sse-sub.middlewares=sec-headers@file,sse-passthrough@file"
      - "traefik.http.routers.correios-sse-sub.service=correios-backend"
      # Auth em api.correiosdev.com (rate-limit estrito contra brute-force)
      - "traefik.http.routers.correios-auth-sub.rule=Host(`api.correiosdev.com`) && (Path(`/api/v1/auth/login`) || Path(`/api/v1/auth/refresh`))"
      - "traefik.http.routers.correios-auth-sub.entrypoints=websecure"
      - "traefik.http.routers.correios-auth-sub.tls=true"
      - "traefik.http.routers.correios-auth-sub.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-auth-sub.priority=200"
      - "traefik.http.routers.correios-auth-sub.middlewares=sec-headers@file,rate-limit-auth@file"
      - "traefik.http.routers.correios-auth-sub.service=correios-backend"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3002/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    # Build ESTÁTICO de produção desde 2026-07-28. Antes rodava `vite --host`
    # (servidor de desenvolvimento) para servir correiosdev.com em público, com
    # `usePolling` a cada 3s sobre a árvore montada do host — custava ~78 MB de
    # anon + 76 MB de swap e CPU contínua de watcher, para entregar assets que
    # não mudam entre deploys. O Dockerfile de produção faz `vite build` num
    # estágio Node e serve o `dist/` com nginx:1.27-alpine.
    #
    # O proxy declarado em `vite.config.ts` (server.proxy) NÃO era usado pelos
    # domínios públicos: os routers Traefik `correios-api` (priority 100),
    # `correios-sse` (110) e `correios-auth` (200) já capturam /api, /health e
    # /events antes deste serviço, que tem priority 50. O `server.proxy` só vale
    # ao acessar o Vite direto em localhost:5180, no desenvolvimento local.
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: correiosentrega-frontend
    restart: unless-stopped
    cpus: "0.75"
    cpu_shares: 256
    # nginx servindo arquivos estáticos opera na casa das dezenas de MB; o teto
    # de 384m dimensionava o Vite dev + esbuild.
    mem_limit: 96m
    mem_reservation: 32m
    # SEM environment de build: VITE_* são lidas por `vite.config.ts` em tempo
    # de BUILD (e só na seção `server`, que não existe em produção); as de
    # polling (CHOKIDAR_*/WATCHPACK_*) e NODE_OPTIONS não têm efeito no nginx.
    #
    # SEM bind mounts da árvore do frontend: o conteúdo servido agora vem do
    # `dist/` gerado no build da imagem, em /usr/share/nginx/html. Montar
    # ./frontend/src por cima não teria efeito e mascararia a origem do que é
    # servido.
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - default
      - delivyo_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=delivyo_network"
      - "traefik.http.routers.correios-web.rule=Host(`dev.correiosdev.com`) || Host(`correios.delivyodev.com`)"
      - "traefik.http.routers.correios-web.entrypoints=websecure"
      - "traefik.http.routers.correios-web.tls=true"
      - "traefik.http.routers.correios-web.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-web.priority=50"
      - "traefik.http.routers.correios-web.middlewares=sec-headers@file,compress@file"
      - "traefik.http.routers.correios-web.service=correios-web"
      # Domínio público correiosdev.com (zona Cloudflare separada)
      - "traefik.http.routers.correios-web-public.rule=Host(`correiosdev.com`) || Host(`www.correiosdev.com`)"
      - "traefik.http.routers.correios-web-public.entrypoints=websecure"
      - "traefik.http.routers.correios-web-public.tls=true"
      - "traefik.http.routers.correios-web-public.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-web-public.priority=50"
      - "traefik.http.routers.correios-web-public.middlewares=sec-headers@file,compress@file"
      - "traefik.http.routers.correios-web-public.service=correios-web"
      # 80, não 5180: quem escuta agora é o nginx da imagem de produção, não o
      # dev server do Vite.
      - "traefik.http.services.correios-web.loadbalancer.server.port=80"
    healthcheck:
      # A imagem runtime é nginx:alpine — não tem `node`. wget faz parte do
      # busybox do Alpine.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  osrm-data:
  correios_redis_data:

networks:
  default:
    name: correios_network
    driver: bridge
  delivyo_network:
    external: true
    name: delivyo_network
  dev-internal:
    external: true
    name: dev-internal
