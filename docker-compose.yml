services:
  redis:
    build:
      context: .
      dockerfile: redis/Dockerfile
    container_name: correiosentrega-redis
    profiles: ["legacy"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  osrm:
    build:
      context: .
      dockerfile: osrm/Dockerfile
    container_name: correiosentrega-osrm
    profiles: ["legacy"]
    restart: unless-stopped
    volumes:
      - osrm-data:/data
    environment:
      OSM_REGION_URL: https://download.geofabrik.de/south-america/brazil/centro-oeste-latest.osm.pbf
      OSRM_DATASET: centro-oeste-latest
      OSRM_PROFILE: /opt/car.lua
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/nearest/v1/driving/-47.8825,-15.7942 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  vroom:
    build:
      context: .
      dockerfile: vroom/Dockerfile
    container_name: correiosentrega-vroom
    profiles: ["legacy"]
    restart: unless-stopped
    environment:
      VROOM_ROUTER: osrm
    depends_on:
      osrm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  evolution-api:
    image: correiosentrega-evolution-local:2.3.3
    container_name: correiosentrega-evolution
    profiles: ["legacy"]
    restart: unless-stopped
    environment:
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change_me_evolution_key}
      DATABASE_PROVIDER: postgresql
      DATABASE_ENABLED: "true"
      DATABASE_CONNECTION_URI: postgresql://usr_correiosentrega:Correios123@host.docker.internal:5432/WhatsAppDB
      DATABASE_CONNECTION_CLIENT_NAME: correios_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: correios_evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_VERSION: 2.3000.1020885143
      LOG_LEVEL: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: correiosentrega-backend
    restart: unless-stopped
    mem_limit: 256m
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://temellodev:temellodev123@host.docker.internal:5432/correiosentrega_dev?schema=public
      REDIS_URL: redis://host.docker.internal:6379
      OSRM_URL: http://host.docker.internal:5001
      VROOM_URL: http://host.docker.internal:3000
      EVOLUTION_API_URL: http://host.docker.internal/services/evolution
      EVOLUTION_PILOT_URL: http://host.docker.internal/services/evolution
      EVOLUTION_API_KEY: change_me_evolution_key
      EVOLUTION_PILOT_API_KEY: change_me_evolution_key
      EVOLUTION_PILOT_WEBHOOK_SECRET: ""
      APP_URL: http://backend:3002
      PORT: 3002
      FRONTEND_URL: http://localhost:5181
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
    ports:
      - "3002:3002"
    networks:
      - default
      - delivyo_shared_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=delivyo-services_delivyo_network"
      # Router API (HTTP regular)
      - "traefik.http.routers.correios-api.rule=Host(`correios.delivyodev.com`) && (PathPrefix(`/api`) || PathPrefix(`/health`))"
      - "traefik.http.routers.correios-api.entrypoints=websecure"
      - "traefik.http.routers.correios-api.tls=true"
      - "traefik.http.routers.correios-api.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-api.priority=100"
      - "traefik.http.routers.correios-api.middlewares=sec-headers@file,compress@file,rate-limit-api@file"
      - "traefik.http.routers.correios-api.service=correios-backend"
      # Router SSE (sem buffering, sem compress)
      - "traefik.http.routers.correios-sse.rule=Host(`correios.delivyodev.com`) && PathPrefix(`/events`)"
      - "traefik.http.routers.correios-sse.entrypoints=websecure"
      - "traefik.http.routers.correios-sse.tls=true"
      - "traefik.http.routers.correios-sse.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-sse.priority=110"
      - "traefik.http.routers.correios-sse.middlewares=sec-headers@file,sse-passthrough@file"
      - "traefik.http.routers.correios-sse.service=correios-backend"
      # Router Auth (rate limit mais estrito contra brute force)
      - "traefik.http.routers.correios-auth.rule=Host(`correios.delivyodev.com`) && (Path(`/api/v1/auth/login`) || Path(`/api/v1/auth/refresh`))"
      - "traefik.http.routers.correios-auth.entrypoints=websecure"
      - "traefik.http.routers.correios-auth.tls=true"
      - "traefik.http.routers.correios-auth.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-auth.priority=200"
      - "traefik.http.routers.correios-auth.middlewares=sec-headers@file,rate-limit-auth@file"
      - "traefik.http.routers.correios-auth.service=correios-backend"
      - "traefik.http.services.correios-backend.loadbalancer.server.port=3002"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3002/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  whatsapp-service:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    container_name: correiosentrega-whatsapp
    profiles: ["legacy"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://usr_correiosentrega:Correios123@host.docker.internal:5432/WhatsAppDB?schema=public
      REDIS_URL: redis://redis:6379
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: change_me_evolution_key
      EVOLUTION_PILOT_URL: http://evolution-api:8080
      EVOLUTION_PILOT_API_KEY: change_me_evolution_key
      EVOLUTION_PILOT_WEBHOOK_SECRET: ""
      PORT: 3003
      FRONTEND_URL: http://localhost:5180
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3003/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: correiosentrega-frontend
    restart: unless-stopped
    mem_limit: 256m
    environment:
      VITE_API_TARGET: http://backend:3002
      VITE_WHATSAPP_API_TARGET: http://host.docker.internal
      VITE_WHATSAPP_API_GATEWAY_PREFIX: /services/whatsapp
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ./frontend/tailwind.config.ts:/app/frontend/tailwind.config.ts:ro
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json:ro
      - ./frontend/tsconfig.app.json:/app/frontend/tsconfig.app.json:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5181:5180"
    networks:
      - default
      - delivyo_shared_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=delivyo-services_delivyo_network"
      - "traefik.http.routers.correios-web.rule=Host(`correios.delivyodev.com`)"
      - "traefik.http.routers.correios-web.entrypoints=websecure"
      - "traefik.http.routers.correios-web.tls=true"
      - "traefik.http.routers.correios-web.tls.certresolver=cloudflare"
      - "traefik.http.routers.correios-web.priority=50"
      - "traefik.http.routers.correios-web.middlewares=sec-headers@file,compress@file"
      - "traefik.http.services.correios-web.loadbalancer.server.port=5180"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5180/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  redis-data:
  osrm-data:

networks:
  default:
    name: correios_network
    driver: bridge
  delivyo_shared_network:
    external: true
    name: delivyo-services_delivyo_network
