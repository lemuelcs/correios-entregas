services:
  redis:
    build:
      context: .
      dockerfile: redis/Dockerfile
    container_name: correiosentrega-redis
    profiles: ["legacy"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  osrm:
    build:
      context: .
      dockerfile: osrm/Dockerfile
    container_name: correiosentrega-osrm
    profiles: ["legacy"]
    restart: unless-stopped
    volumes:
      - osrm-data:/data
    environment:
      OSM_REGION_URL: https://download.geofabrik.de/south-america/brazil/centro-oeste-latest.osm.pbf
      OSRM_DATASET: centro-oeste-latest
      OSRM_PROFILE: /opt/car.lua
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/nearest/v1/driving/-47.8825,-15.7942 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  vroom:
    build:
      context: .
      dockerfile: vroom/Dockerfile
    container_name: correiosentrega-vroom
    profiles: ["legacy"]
    restart: unless-stopped
    environment:
      VROOM_ROUTER: osrm
    depends_on:
      osrm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: correiosentrega-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://temellodev:temellodev123@host.docker.internal:5432/correiosentrega_dev?schema=public
      REDIS_URL: redis://host.docker.internal:6379
      OSRM_URL: http://host.docker.internal:5001
      VROOM_URL: http://host.docker.internal:3000
      EVOLUTION_API_URL: http://host.docker.internal/services/evolution
      EVOLUTION_PILOT_URL: http://host.docker.internal/services/evolution
      EVOLUTION_API_KEY: change_me_evolution_key
      EVOLUTION_PILOT_API_KEY: change_me_evolution_key
      EVOLUTION_PILOT_WEBHOOK_SECRET: ""
      APP_URL: http://backend:3002
      PORT: 3002
      FRONTEND_URL: http://localhost:5181
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3002/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: correiosentrega-frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://backend:3002
      VITE_WHATSAPP_API_TARGET: http://host.docker.internal
      VITE_WHATSAPP_API_GATEWAY_PREFIX: /services/whatsapp
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
      - ./frontend/vite.config.ts:/app/frontend/vite.config.ts
      - ./frontend/tailwind.config.ts:/app/frontend/tailwind.config.ts:ro
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json:ro
      - ./frontend/tsconfig.app.json:/app/frontend/tsconfig.app.json:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5181:5180"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5180/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  redis-data:
  osrm-data:
