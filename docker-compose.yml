services:
  redis:
    build:
      context: .
      dockerfile: redis/Dockerfile
    container_name: correiosentrega-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  osrm:
    build:
      context: .
      dockerfile: osrm/Dockerfile
    container_name: correiosentrega-osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - osrm-data:/data
    environment:
      OSM_REGION_URL: https://download.geofabrik.de/south-america/brazil/centro-oeste-latest.osm.pbf
      OSRM_DATASET: centro-oeste-latest
      OSRM_PROFILE: /opt/car.lua
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/nearest/v1/driving/-47.8825,-15.7942 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  vroom:
    build:
      context: .
      dockerfile: vroom/Dockerfile
    container_name: correiosentrega-vroom
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VROOM_ROUTER: osrm
    depends_on:
      osrm:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: correiosentrega-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://usr_correiosentrega:Correios123@host.docker.internal:5432/correiosentrega_dev?schema=public
      REDIS_URL: redis://redis:6379
      OSRM_URL: http://osrm:5000
      VROOM_URL: http://vroom:3000
      PORT: 3002
      FRONTEND_URL: http://localhost:5180
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      osrm:
        condition: service_started
      vroom:
        condition: service_started
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3002/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: correiosentrega-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5180:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  redis-data:
  osrm-data:
