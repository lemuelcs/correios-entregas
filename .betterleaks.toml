# Allowlist deste repositório. Cada entrada precisa de um comentário '# motivo:' logo acima
# (tools/segredos/sincronizar-regras.sh confere). Prefira allowlist por VALOR exato: um segredo real
# colado no mesmo arquivo continua sendo detectado.
