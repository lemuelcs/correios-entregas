# --- base Tevunia: início (tevunia-platform/templates/segredos/betterleaks.toml) ---
# Configuração base do Betterleaks para todos os repositórios (ADR-012, #47).
#
# Cada repositório copia este bloco, sem alterar, para o seu `.betterleaks.toml` e acrescenta
# depois do marcador "fim" só a sua allowlist. `tools/segredos/sincronizar-regras.sh` confere que a
# cópia é idêntica e que cada entrada da allowlist tem um comentário `# motivo:` logo acima.
#
# O Betterleaks não carrega o `.betterleaks.toml` do alvo sozinho: o hook e o CI passam `-c`.
#
# Regras próprias: fornecedores fora do programa de parceiros do GitHub, reconhecidos pelo nome da
# variável junto de um valor longo (`ZAPSIGN_API_TOKEN=…`, `"clicksignToken": "…"`, e o par
# `'zapiToken', '…'` de jsonb_build_object em seeds SQL). O valor não
# aceita `.`, `$` nem `{`, então `process.env.X`, `${X}` e `${{ secrets.X }}` não disparam; o filtro
# descarta valores de baixa entropia, texto legível e marcadores de exemplo. Fixtures de teste
# usam valores gerados na hora, nunca chaves reais.

[extend]
useDefault = true

# Exceções da base, só para as duas regras genéricas que o gitleaks 8.24.3 não tinha e que, medidas em
# 26/11/2026 nos 9 repositórios, acusavam sobretudo credencial de banco local e senha de teste.
# Regras específicas (Stripe, AWS, as próprias abaixo etc.) continuam valendo nesses mesmos arquivos.
[[allowlists]]
description = "URI de banco local ou de serviço do compose de dev/CI (não é credencial de produção)"
targetRules = ["generic-credential-uri"]
regexTarget = "match"
regexes = [
  # motivo: loopback e nomes de serviço do compose de dev/CI; `prod_postgres` e hosts reais continuam acusando
  '''@(?:localhost|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|host|db|postgres|redis|pg|mysql|dev_postgres|dev_redis)(?::\d+)?(?:[/?'"\x60\s]|$)''',
]

[[allowlists]]
description = "Senha literal em teste, fixture ou mock"
targetRules = ["generic-password"]
paths = [
  # motivo: testes usam senha literal de propósito (login, hash, redação); segredo real em teste cai nas regras específicas
  '''(?:^|/)(?:test|tests|__tests__|e2e|fixtures?|mocks?)/''',
  # motivo: idem, pelo sufixo do arquivo de teste
  '''\.(?:test|spec|e2e|integration\.test)\.[cm]?[jt]sx?$''',
]

[[rules]]
id = "voyage-api-key"
description = "Chave da API da Voyage AI atribuída a uma variável"
regex = '''(?im)voyage(?:[_.-]?ai)?[\w.-]{0,25}?(?:secret|token|key|senha|password|chave|credencial|credential)[\w-]{0,10}?[ \t'"\x60]{0,3}(?:=|:=|=>|:|\?=|['"\x60][ \t]*,[ \t]*['"\x60])[ \t'"\x60]{0,5}([A-Za-z0-9_+/=-]{24,200})(?:[ \t'"\x60;,)\]}]|\\[nr]|$)'''
keywords = ["voyage"]
filter = '''
filter.entropy(finding["secret"]) < 3.0 ||
filter.failsTokenEfficiency(finding["secret"]) ||
filter.containsAny(lower(finding["secret"]), ["example", "exemplo", "changeme", "placeholder", "xxxxxx", "your", "seu-", "sua-", "fake", "dummy", "redacted"])
'''

