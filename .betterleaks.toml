# Nomes curtos (Z-API, Efí, Stark, Inter): o nome do fornecedor precisa começar um identificador e
# vir seguido de separador, de maiúscula (camelCase) ou direto da palavra de credencial, para não
# casar com `lazapi`, `efficient`, `starken` ou `internal`. Por isso o nome não usa `(?i)`.

[[rules]]
id = "zapi-token"
description = "Token de instância ou de cliente da Z-API atribuído a uma variável"
regex = '''(?m)(?:^|[^A-Za-z0-9\n])(?:Z_API|Z-API|ZAPI|ZApi|Zapi|zApi|z_api|z-api|zapi)(?:[_.-](?i:[\w.-]{0,25}?)|[A-Z](?i:[\w.-]{0,24}?)|)(?i:(?:secret|token|key|senha|password|chave|credencial|credential)[\w-]{0,10}?)[ \t'"\x60]{0,3}(?:=|:=|=>|:|\?=|['"\x60][ \t]*,[ \t]*['"\x60])[ \t'"\x60]{0,5}([A-Za-z0-9_+/=-]{20,200})(?:[ \t'"\x60;,)\]}]|\\[nr]|$)'''
keywords = ["zapi", "z_api", "z-api"]
filter = '''
filter.entropy(finding["secret"]) < 3.0 ||
filter.failsTokenEfficiency(finding["secret"]) ||
filter.containsAny(lower(finding["secret"]), ["example", "exemplo", "changeme", "placeholder", "xxxxxx", "your", "seu-", "sua-", "fake", "dummy", "redacted"])
'''

