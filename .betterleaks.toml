# Inter: só com qualificador do banco (`BANCO_INTER_*`, `INTER_CLIENT_*`, `INTER_PIX_*`, `INTER_API_*`,
# `INTER_CERT_*`, `INTER_BANKING_*`), para não pegar `INTER_SERVICE_TOKEN` e afins.
[[rules]]
id = "inter-credencial"
description = "Client secret ou senha de certificado do Banco Inter atribuído a uma variável"
regex = '''(?m)(?:^|[^A-Za-z0-9\n])(?:(?:BANCO|Banco|banco)[_.-]?(?:INTER|Inter|inter)|(?:INTER|Inter|inter)[_.-]?(?i:client|pix|api|cert|banking|bank))(?:[_.-](?i:[\w.-]{0,25}?)|[A-Z](?i:[\w.-]{0,24}?)|)(?i:(?:secret|token|key|senha|password|chave|credencial|credential)[\w-]{0,10}?)[ \t'"\x60]{0,3}(?:=|:=|=>|:|\?=|['"\x60][ \t]*,[ \t]*['"\x60])[ \t'"\x60]{0,5}([A-Za-z0-9_+/=-]{20,200})(?:[ \t'"\x60;,)\]}]|\\[nr]|$)'''
keywords = ["inter"]
filter = '''
filter.entropy(finding["secret"]) < 3.0 ||
filter.failsTokenEfficiency(finding["secret"]) ||
filter.containsAny(lower(finding["secret"]), ["example", "exemplo", "changeme", "placeholder", "xxxxxx", "your", "seu-", "sua-", "fake", "dummy", "redacted"])
'''
